name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    name: lint and offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Type check
        run: uv run mypy src tests scripts

      - name: Tests (fully offline, no secrets)
        run: uv run pytest -q

      - name: Guard against banned heavy dependencies
        run: |
          if uv pip list | grep -Eiq '^(torch|onnxruntime|transformers|sentence-transformers|spacy|docling|marker|easyocr|ollama|ragas|deepeval)[[:space:]]'; then
            echo "::error::Banned heavy dependency detected"
            exit 1
          fi

  ui:
    name: annotator app tests (ui extra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies with the ui extra
        run: uv sync --frozen --extra ui

      - name: Annotator app tests (streamlit AppTest)
        run: uv run pytest -q tests/test_annotator_app.py
