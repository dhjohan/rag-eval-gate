[project]
name = "rag-eval-gate"
version = "0.1.0"
description = "Evals-first, CI-gated RAG over a messy corpus using free-tier cloud APIs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "google-genai>=3.6.1",
    "httpx>=0.28.1",
    "numpy>=2.0",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0.2",
    "rich>=15.0.0",
    "tenacity>=9.1.4",
    "typer>=0.29.2",
    "tzdata>=2026.6; sys_platform == 'win32'",
]

[project.scripts]
rag-eval = "rag_eval.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_eval"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Typer's CLI ergonomics depend on calls in argument defaults.
"src/rag_eval/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
