[project]
name = "rag-eval-gate"
version = "0.1.0"
description = "Evals-first, CI-gated RAG over a messy corpus using free-tier cloud APIs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "google-genai>=3.6.1",
    "httpx>=0.28.1",
    "numpy>=2.0",
    "pdfplumber>=0.11.11",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.7",
    "pymupdf>=1.24,<2",
    "pyyaml>=6.0.2",
    "rich>=15.0.0",
    "tenacity>=9.1.4",
    "tiktoken>=0.14.0",
    "typer>=0.29.2",
    "tzdata>=2026.6; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Local annotation workbench only. Kept out of the core runtime so CI stays
# fast and minimal; install with `uv sync --extra ui`.
ui = ["streamlit>=1.38"]

[project.scripts]
rag-eval = "rag_eval.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_eval"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Typer's CLI ergonomics depend on calls in argument defaults.
"src/rag_eval/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"

# Pure-CPU PDF/tokenizer libraries that do not ship type stubs.
[[tool.mypy.overrides]]
module = ["pdfplumber.*", "pymupdf.*", "tiktoken.*"]
ignore_missing_imports = true

# Optional local UI; not part of the core runtime or CI.
[[tool.mypy.overrides]]
module = ["streamlit.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
